name: PipelineGuard CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Version
        run: python --version

      - name: Verify Flask Installation
        run: python -c "import flask; print('Flask Installed Successfully')"

      - name: Verify PyYAML Installation
        run: python -c "import yaml; print('PyYAML Installed Successfully')"

      - name: Verify ReportLab Installation
        run: python -c "import reportlab; print('ReportLab Installed Successfully')"

      - name: CI Completed
        run: echo "PipelineGuard CI completed successfully."