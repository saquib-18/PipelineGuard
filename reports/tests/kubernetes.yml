apiVersion: apps/v1
kind: Deployment

metadata:
  name: pipelineguard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pipelineguard

  template:
    metadata:
      labels:
        app: pipelineguard

    spec:
      containers:

        - name: web
          image: nginx:1.27

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          securityContext:
            runAsNonRoot: true
            privileged: false

          readinessProbe:
            httpGet:
              path: /
              port: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80