<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PipelineGuard</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

    <h1>🚀 PipelineGuard</h1>

    <p class="subtitle">
        Pipeline-as-Code Linter & Validator
    </p>

    <div class="card">

        <h2>Upload Pipeline File</h2>

        <input
            type="file"
            id="fileInput">

        <br>

        <button onclick="uploadFile()">
            Upload & Validate
        </button>

    </div>

    <div class="card">

        <h2>Validation Report</h2>

        <div id="result">

            Waiting for validation...

        </div>

    </div>

    <div class="footer">

        <hr><br>

        <p>

            PipelineGuard v2.0

            <br>

            Developed for DevOps Pipeline Validation

        </p>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
